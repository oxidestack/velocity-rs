# The release: a version tag publishes the crate on crates.io. `v0.2.0` is a release; `v0.2.0-rc.1` a pre-release,
# which crates.io records as one (`cargo add` and a `"0.2"` requirement never pick it). Either is tagged on `main`, on
# a commit whose Cargo.toml already carries the tag's version.
#
# - `gate`: tools/release/release.py check, which refuses the tag before anything runs when the tag is no version,
#   Cargo.toml says another one, or (a release only) CHANGELOG.md has no section for it, or that section has Action
#   required and docs/guide/upgrading.md has no `## Upgrading to <version>` section; and when a dependency on a sibling
#   repository's crate has no matching version on crates.io yet, since the published crate depends on that, not on the
#   path (the publish order: the sibling's release first). Then the tagged commit must be on `main`.
# - `checks`: the crate's tests, clippy and rustdoc, warnings as errors, on the tagged commit.
# - `publish`: `cargo publish` with a token from crates.io's trusted publishing: rust-lang/crates-io-auth-action
#   trades this job's GitHub OIDC token for a short-lived crates.io token and revokes it when the job ends, so no
#   secret is stored. crates.io accepts it only from this repository's release.yml in the `release` environment, as
#   the crate's Trusted Publishing settings name them; the environment is the one place the OIDC token is granted.
# - `github-release`: the GitHub release of the tag, its notes CHANGELOG.md's section (drafted before the tag by
#   `make release-notes`, then edited); a pre-release is marked one and never `latest`.
# - `site`: for a release, runs site.yml on `main`, which deploys the documentation site with this release at its root
#   and under its version (site/README.md, "Versions"). A pre-release builds no documentation version.
#
# A manual run (`gh workflow run release.yml`, or Actions → Release → Run workflow) is the dry run of a pre-release,
# and publishes nothing: the gate on the Unreleased section, the checks, then the tree stamped with the pre-release
# version (Cargo.toml's with `-rc.0`, or the `version` input), `cargo publish --dry-run` of it, and its release notes
# in the run's summary.
#
# While the repository is private a tag push starts nothing billed (the gate's `if:`, as in ci.yml); a manual run
# always runs. Every action is pinned by its full commit, its release in a comment; every checkout keeps no
# credential.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The pre-release version the dry run packages (default Cargo.toml's with -rc.0)
        required: false
        default: ''

# One run per tag at a time; a second run for the same tag waits rather than cancelling a publication half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing at the top: each job is granted what it uses.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # A job container runs as root on a workspace the runner's user owns, which git refuses as a dubious ownership.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # `main`, to see the tag is on it
      - name: the tag, the tree and crates.io agree
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then
            python3 tools/release/release.py check "$REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            # shellcheck disable=SC2086 # an empty input is no argument
            python3 tools/release/release.py check --dry-run $DRY_RUN_VERSION | tee -a "$GITHUB_OUTPUT"
          fi
      - name: the tagged commit is on main
        if: ${{ github.event_name == 'push' }}
        env:
          SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "::error title=release::$SHA is not on main: a release is tagged on main"
            exit 1
          }

  checks:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.99.1-trixie@sha256:8a4e90c7946b74626488b1446f712c0fe0ed1a596cbd3d871684bc9c5433ae07
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The JDK semantics this crate builds on, a sibling checkout (Cargo.toml's `../java-compat-rs`).
      - run: git clone --depth 1 https://github.com/oxidestack/java-compat-rs.git ../java-compat-rs
      # No cargo cache: a release builds from nothing a branch's run could have written.
      - run: rustup component add clippy
      - run: make test
      - run: make lint
      - run: make doc

  publish:
    if: ${{ github.event_name == 'push' && !github.event.repository.private }}
    needs: [gate, checks]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read  # actions/checkout reads the repository
      id-token: write  # crates-io-auth-action trades the job's OIDC token for a crates.io token
    container: rust:1.99.1-trixie@sha256:8a4e90c7946b74626488b1446f712c0fe0ed1a596cbd3d871684bc9c5433ae07
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # The JDK semantics this crate builds on, a sibling checkout (Cargo.toml's `../java-compat-rs`).
      - run: git clone --depth 1 https://github.com/oxidestack/java-compat-rs.git ../java-compat-rs
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 tools/release/release.py publish

  github-release:
    if: ${{ github.event_name == 'push' && !github.event.repository.private }}
    needs: [gate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creates the release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 tools/release/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [ "$PRERELEASE" = true ]; then
            kind="--prerelease --latest=false"
          else
            kind="--latest"
          fi
          if gh release view "$REF_NAME" > /dev/null 2>&1; then
            # A re-run: the same release, its notes replaced.
            # shellcheck disable=SC2086 # $kind is flags
            gh release edit "$REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $kind
          else
            # shellcheck disable=SC2086 # $kind is flags
            gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $kind
          fi

  site:
    # The site deploys from `main` only, so once this release is out site.yml runs again on `main`, where the tag now
    # exists and becomes the root.
    if: ${{ github.event_name == 'push' && !github.event.repository.private && needs.gate.outputs.prerelease == 'false' }}
    needs: [gate, github-release]
    runs-on: ubuntu-24.04
    permissions:
      actions: write  # starts site.yml on main
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run site.yml --repo "$REPOSITORY" --ref main

  dry-run:
    # A manual run's publication: the pre-release packaged and verified as crates.io would, nothing uploaded.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [gate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # actions/checkout reads the repository
    container: rust:1.99.1-trixie@sha256:8a4e90c7946b74626488b1446f712c0fe0ed1a596cbd3d871684bc9c5433ae07
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # The JDK semantics this crate builds on, a sibling checkout (Cargo.toml's `../java-compat-rs`).
      - run: git clone --depth 1 https://github.com/oxidestack/java-compat-rs.git ../java-compat-rs
      - name: cargo publish --dry-run of the pre-release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 tools/release/release.py stamp "$VERSION"
          python3 tools/release/release.py publish --dry-run
          {
            echo "### Dry run of $VERSION: the release notes"
            echo
            python3 tools/release/release.py notes "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
